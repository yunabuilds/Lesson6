<!DOCTYPE html>
<!-- ↑ 「これはHTMLファイルです」とブラウザに伝える宣言 -->

<html lang="ja">
<!-- ↑ HTMLの始まり。lang="ja" は日本語のページであることを示す -->

<head>
  <!-- head の中は「設定情報」。ブラウザには表示されない -->
  <meta charset="UTF-8">
  <!-- ↑ 文字コードの指定。日本語を正しく表示するために必要 -->

  <title>自己紹介</title>
  <!-- ↑ ブラウザのタブに表示されるタイトル -->

  <!-- Google Fonts: Noto Sans JP を読み込む -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* CSSはここに書く。「どの要素を」「どう見せるか」を指定する */

    body {
      /* body = ページ全体に適用するスタイル */
      background: linear-gradient(135deg, #0d2b6e, #56c0e0); /* 濃い青→水色のグラデーション */
      font-family: 'Noto Sans JP', sans-serif; /* Google Fonts のフォント */
      min-height: 100vh;   /* 画面の高さいっぱいに背景を広げる */
      margin: 0;
      display: flex;
      justify-content: center; /* 横方向：中央揃え */
      align-items: center;     /* 縦方向：中央揃え */
    }

    .card {
      /* 白い角丸カード */
      background-color: #ffffff;
      border-radius: 20px;         /* 角丸 */
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2); /* 影でふわっと浮いて見せる */
      padding: 48px 56px;
      max-width: 480px;
      width: 90%;
    }

    h1 {
      /* h1 = 名前の大見出し */
      color: #1a2e6e;   /* 濃い青 */
      font-size: 36px;  /* 大きく */
      font-weight: 700; /* 太字 */
      margin-bottom: 8px;
    }

    p {
      /* p = 段落テキスト */
      color: #555;
      line-height: 1.8; /* 行間 */
    }

    ul {
      list-style: none; /* デフォルトの「・」を消す */
      padding: 0;
      margin-top: 16px;
    }

    li {
      background-color: #eef4ff;  /* 薄い青の背景 */
      color: #1a2e6e;
      border-radius: 8px;         /* 角丸 */
      padding: 10px 16px;         /* 内側の余白 */
      margin-bottom: 8px;         /* 項目間の余白 */
      cursor: pointer;
      transition: background-color 0.3s; /* 0.3秒でなめらかに切り替え */
    }

    li:hover {
      background-color: #56c0e0; /* hover時：水色に変わる */
      color: #ffffff;
    }

    h2 {
      color: #1a2e6e;
      font-size: 20px;
      font-weight: 700;
      margin-top: 32px;
      margin-bottom: 12px;
    }

    .skill-item {
      margin-bottom: 14px;
    }

    .skill-label {
      display: flex;
      justify-content: space-between; /* 名前を左、%を右に配置 */
      color: #555;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .skill-bar-bg {
      background-color: #e8eef8; /* バーの背景（薄いグレー） */
      border-radius: 100px;
      height: 12px;
      overflow: hidden;
    }

    .skill-bar {
      height: 100%;
      width: var(--width);           /* HTML側の style="--width:XX%" を参照 */
      border-radius: 100px;
      background: linear-gradient(90deg, #0d2b6e, #56c0e0); /* グラデーション */
      animation: growBar 1s ease-out 0.8s both;
      /* ↑ 1秒で伸びる、カードのfadeInUp(0.8s)が終わってから開始、both=開始前は幅0を保つ */
    }

    @keyframes growBar {
      from { width: 0; }
      to   { width: var(--width); }
    }

    a {
      display: inline-block;
      margin-top: 16px;
      color: #0d2b6e;
    }

    img {
      display: block;
      margin-top: 20px;
      max-width: 100%;
      border-radius: 12px;
    }

    /* 下から上にふわっと現れるアニメーション */
    @keyframes fadeInUp {
      from {
        opacity: 0;           /* 最初は透明 */
        transform: translateY(40px); /* 40px 下にずらした位置から始める */
      }
      to {
        opacity: 1;           /* 最後は完全に表示 */
        transform: translateY(0);    /* 元の位置に戻る */
      }
    }

    .card {
      animation: fadeInUp 0.8s ease-out; /* 0.8秒でなめらかに再生 */
    }
  </style>
</head>

<body>
  <!-- 自己紹介カード -->
  <div class="card">

    <h1>武山由奈</h1>
    <!-- ↑ 大見出し。ページで最も目立つタイトルに使う -->

    <p>こんにちは！プログラミングを学習中です。</p>
    <!-- ↑ 段落テキスト。普通の文章は p タグで囲む -->

    <ul>
      <!-- ul = 箇条書きリスト。li で各項目を囲む -->
      <li>趣味: 読書</li>
      <li>趣味: 音楽</li>
      <li>趣味: 旅行</li>
      <li>趣味: Netflixでドラマ</li>
      <li>趣味: ドリンク巡り</li>
    </ul>

    <h2>スキル</h2>
    <div class="skills">

      <div class="skill-item">
        <div class="skill-label">
          <span>HTML/CSS</span>
          <span>40%</span>
        </div>
        <div class="skill-bar-bg">
          <div class="skill-bar" style="--width: 40%"></div>
        </div>
      </div>

      <div class="skill-item">
        <div class="skill-label">
          <span>JavaScript</span>
          <span>20%</span>
        </div>
        <div class="skill-bar-bg">
          <div class="skill-bar" style="--width: 20%"></div>
        </div>
      </div>

      <div class="skill-item">
        <div class="skill-label">
          <span>AI活用</span>
          <span>80%</span>
        </div>
        <div class="skill-bar-bg">
          <div class="skill-bar" style="--width: 80%"></div>
        </div>
      </div>

    </div>

    <a href="https://www.google.com">Googleを開く</a>
    <img src="photo.jpg" alt="石鹸２.jpg">

  </div>
</body>
<!-- ↑ HTMLの終わり -->
</html>
