<!DOCTYPE html>
<!-- ↑ 「これはHTMLファイルです」とブラウザに伝える宣言 -->

<html lang="ja">
<!-- ↑ HTMLの始まり。lang="ja" は日本語のページであることを示す -->

<head>
  <!-- head の中は「設定情報」。ブラウザには表示されない -->
  <meta charset="UTF-8">
  <!-- ↑ 文字コードの指定。日本語を正しく表示するために必要 -->

  <title>自己紹介</title>
  <!-- ↑ ブラウザのタブに表示されるタイトル -->

  <style>
    /* CSSはここに書く。「どの要素を」「どう見せるか」を指定する */

    body {
      /* body = ページ全体に適用するスタイル */
      background-color: #f0f8ff; /* 背景色（薄い水色） */
      font-family: sans-serif;   /* フォントの種類 */
    }

    h1 {
      /* h1 = 大見出しに適用するスタイル */
      color: #333;     /* 文字色（濃いグレー） */
      font-size: 28px; /* 文字サイズ */
    }

    p {
      /* p = 段落テキストに適用するスタイル */
      color: #555;      /* 文字色（グレー） */
      line-height: 1.8; /* 行間（1.8倍に広げる） */
    }
  </style>
</head>

<body>
  <!-- body の中に「表示したい内容」を書く -->

  <h1>武山由奈</h1>
  <!-- ↑ 大見出し。ページで最も目立つタイトルに使う -->

  <p>こんにちは！プログラミングを学習中です。</p>
  <!-- ↑ 段落テキスト。普通の文章は p タグで囲む -->

  <ul>
    <!-- ul = 箇条書きリスト。li で各項目を囲む -->
    <li>趣味: 読書</li>
    <li>趣味: 音楽</li>
    <li>趣味: 旅行</li>
    <li>趣味: Netflixでドラマ</li>
    <li>趣味: ドリンク巡り</li>
  </ul>
<a href="https://www.google.com">Googleを開く</a>
<img src="photo.jpg" alt="石鹸２.ipg">

<footer>
  <p>© 2025 武山由奈</p>
</footer>
</body>
<!-- ↑ HTMLの終わり -->
